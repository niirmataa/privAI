[package]
name = "privai-wallet"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "MIT"
description = "Wallet state and note tracking for privAI hidden notes"

[dependencies]
blake3 = "1.5"
getrandom = "0.4.2"
nxms-transport = { path = "../nxms-transport" }
privai-chain = { path = "../privai-chain" }
privai-proof = { path = "../privai-proof" }
rand = "0.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
zeroize = { version = "1", features = ["zeroize_derive"] }
