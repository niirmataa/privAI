[package]
name = "privai-context-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "UNLICENSED"
publish = false

[workspace]

[dependencies]
rust-mcp-sdk = { version = "0.9.0", features = ["stdio", "macros"] }
async-trait = "0.1"
clap = { version = "=4.5.23", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
