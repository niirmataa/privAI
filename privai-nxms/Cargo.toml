[package]
name = "privai-nxms"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "PRIVAI/1 application messages carried over NXMS/2"

[dependencies]
nxms-transport = { path = "../nxms-transport", default-features = false }
privai-chain = { path = "../privai-chain" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
hex = "0.4"
blake3 = "1.5"
