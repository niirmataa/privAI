[package]
name = "privai-node"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Node configuration and block production scaffold for privAI"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
privai-chain = { path = "../privai-chain" }
privai-ledger = { path = "../privai-ledger" }
privai-proof = { path = "../privai-proof" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
toml = "0.8"

[dev-dependencies]
privai-wallet = { path = "../privai-wallet" }
