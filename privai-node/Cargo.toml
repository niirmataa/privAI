[package]
name = "privai-node"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Node configuration and block production scaffold for privAI"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
nxms-transport = { path = "../nxms-transport", default-features = false, features = ["crypto"] }
privai-chain = { path = "../privai-chain" }
privai-ledger = { path = "../privai-ledger" }
privai-proof = { path = "../privai-proof" }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
zeroize = "1.8"

[dev-dependencies]
privai-wallet = { path = "../privai-wallet" }
