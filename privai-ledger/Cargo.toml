[package]
name = "privai-ledger"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Ledger state, storage, mempool, and block application logic for privAI"

[dependencies]
nxms-transport = { path = "../nxms-transport", default-features = false, features = ["crypto"] }
privai-chain = { path = "../privai-chain" }
privai-proof = { path = "../privai-proof" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
