[package]
name = "privai-proof"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "MIT"
description = "Proof-carrying block verification scaffold for privAI"

[dependencies]
blake3 = "1.5"
halo2_gadgets = "0.4"
halo2_proofs = "0.3"
privai-chain = { path = "../privai-chain" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
